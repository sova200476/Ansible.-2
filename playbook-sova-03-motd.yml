---
- name: Configure custom MOTD
  hosts: servers
  become: yes
  vars:
    custom_motd: |
      ============================================
        Добро пожаловать на мой личный сервер {{ inventory_hostname }}
        Управляется с помощью Ansible при поддержке
        Пользователь: {{ ansible_user }}
      ============================================

  tasks:
  - name: Deploy static MOTD banner
    ansible.builtin.copy:
      content: "{{ custom_motd }}"
      dest: /etc/motd
      owner: root
      group: root
      mode: '0644'

  - name: Disable dynamic MOTD scripts (Ubuntu-specific)
    ansible.builtin.file:
      path: "/etc/update-motd.d/{{ item }}"
      mode: '0644'
    loop:
    - 00-header
    - 10-help-text
    - 50-motd-news
    - 85-fwupd
    - 88-esm-announce
    - 90-updates-available
    - 91-contract-ua-esm-status
    - 91-release-upgrade
    - 92-unattended-upgrades
    - 95-hwe-eol
    - 98-fsck-at-reboot
    - 98-reboot-required
    failed_when: false

  - name: Display MOTD content for verification
    ansible.builtin.command:
      cmd: cat /etc/motd
    register: motd_content
    changed_when: false

  - name: Show MOTD verification
    ansible.builtin.debug:
      msg: "MOTD content:

        {{ motd_content.stdout }}"
